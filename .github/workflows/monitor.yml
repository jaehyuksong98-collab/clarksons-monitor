name: Clarksons monitor
on:
  schedule:
    - cron: '15 8 * * 1,4'
  workflow_dispatch:
  push:
    branches: ['feat/results-automation']
permissions:
  contents: read
concurrency:
  group: clarksons-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (offline, real historical PDF fixture)
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        with:
          path: outputs/state.json
          key: monitor-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: monitor-state-${{ github.ref_name }}-
      - name: Live official results and company news
        run: python -m clarksons_monitor --output outputs/live --state outputs/state.json
      - name: Historical H1 replay (explicitly not FY actuals)
        if: github.event_name != 'schedule'
        run: python -m clarksons_monitor --replay-h1 --output outputs/replay --state outputs/state.json
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: outputs/state.json
          key: monitor-state-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarksons-review-${{ github.run_id }}
          path: outputs/
          retention-days: 30
